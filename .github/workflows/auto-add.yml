name: Update Data JSON

on:
  issues:
    types: [opened]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update data.json with new User ID
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          USER_ID=$(echo "$ISSUE_TITLE" | sed 's/SUBMIT_ID: //g' | xargs)
          
          if [ -n "$USER_ID" ]; then
            # Read existing JSON or fallback to empty object
            if [ -f data.json ]; then
              cat data.json > temp.json
            else
              echo "{}" > temp.json
            fi
            
            # Add or Update ID with PENDING status using node
            node -e '
              const fs = require("fs");
              let data = {};
              try { data = JSON.parse(fs.readFileSync("temp.json")); } catch(e){}
              const id = process.env.USER_ID;
              if(!data[id]) { data[id] = "PENDING"; }
              fs.writeFileSync("data.json", JSON.stringify(data, null, 2));
            '
            rm temp.json
          fi
        env:
          USER_ID: ${{ github.event.issue.title }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.json
          git commit -m "Auto-add new ID from Issue" || exit 0
          git push
