<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAME VERIFY - Devil Developers</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: #090c10;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    .bg-glow-1 { position: absolute; width: 350px; height: 350px; background: rgba(255, 0, 85, 0.25); filter: blur(120px); border-radius: 50%; top: 10%; left: 15%; z-index: -1; }
    .bg-glow-2 { position: absolute; width: 350px; height: 350px; background: rgba(0, 210, 255, 0.2); filter: blur(120px); border-radius: 50%; bottom: 10%; right: 15%; z-index: -1; }
    .card {
      background: rgba(18, 24, 38, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff0055, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .subtitle { font-size: 13px; color: #8a99ad; margin-bottom: 28px; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #8a99ad; font-size: 18px; }
    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.3s ease;
    }
    .input-group input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
      transition: 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 0, 85, 0.6);
    }
    .result-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-id-display { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 18px; }
    .badge { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-pending { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.4); }
    .badge-verified { background: rgba(0, 230, 118, 0.15); color: #00e676; border: 1px solid rgba(0, 230, 118, 0.4); box-shadow: 0 0 15px rgba(0, 230, 118, 0.2); }
    .footer { margin-top: 30px; font-size: 12px; color: #5a6e85; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .footer span { color: #ff0055; }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <h1 class="title">NAME VERIFY</h1>
    <p class="subtitle">Enter your Unique ID to check status</p>

    <div class="input-group">
      <i class="fa-solid fa-id-card"></i>
      <input type="text" id="userIdInput" placeholder="Enter Your ID (e.g., DEV123)" autocomplete="off">
    </div>

    <button class="btn-submit" onclick="verifyUser()">
      <span>VERIFY NOW</span>
      <i class="fa-solid fa-paper-plane"></i>
    </button>

    <div id="resultBox" class="result-box">
      <div style="font-size: 14px; color: #a0aec0; margin-bottom: 8px;">ID: <span id="displayId" class="user-id-display">--</span></div>
      <div style="font-size: 12px; color: #718096; margin-top: 5px;">STATUS:</div>
      <div id="statusBadge" class="badge">--</div>
    </div>
  </div>

  <div class="footer">CREATED BY <span>DEVIL DEVELOPERS</span></div>

  <script>
    // ⚠️ Apna GitHub Username aur Repository name yahan likhein
    const GITHUB_USER = 'NEXURA-M';
    const REPO_NAME = 'SIMPLILEARN';

    const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/data.json`;
    const ISSUES_API = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues`;

    async function verifyUser() {
      const userId = document.getElementById('userIdInput').value.trim().toUpperCase();
      const resultBox = document.getElementById('resultBox');
      const displayId = document.getElementById('displayId');
      const statusBadge = document.getElementById('statusBadge');

      if (!userId) {
        alert('Please enter a valid User ID!');
        return;
      }

      displayId.innerText = userId;
      resultBox.style.display = 'block';
      statusBadge.innerText = 'CHECKING...';
      statusBadge.className = 'badge badge-pending';

      try {
        // 1. Check data.json
        const res = await fetch(DATA_URL + '?t=' + new Date().getTime());
        const data = await res.json();

        if (data.users && data.users[userId]) {
          const status = data.users[userId];
          statusBadge.innerText = status;
          statusBadge.className = status === 'VERIFIED' ? 'badge badge-verified' : 'badge badge-pending';
        } else {
          // 2. If ID not found, create a GitHub Issue automatically (Public API allows creating issues without auth token)
          statusBadge.innerText = 'REGISTERING ID...';

          await fetch(ISSUES_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: userId,
              body: `Automated registration request for user ID: ${userId}`
            })
          });

          setTimeout(() => {
            statusBadge.innerText = 'PENDING (REFRESH IN 10s)';
            statusBadge.className = 'badge badge-pending';
          }, 3000);
        }
      } catch (err) {
        console.error(err);
        statusBadge.innerText = 'PENDING';
        statusBadge.className = 'badge badge-pending';
      }
    }
  </script>
</body>
</html>
