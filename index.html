<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Verification - Devil Developers</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #0d1b2a, #000814);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Modern Glassmorphic Container */
    .card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 24px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.1);
      text-align: center;
      position: relative;
    }

    .card h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn {
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #d4af37);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 215, 0, 0.4);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Box */
    .status-container {
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
    }

    .status-title {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .status-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-pending {
      color: #ffb703;
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
    }

    .status-verified {
      color: #00f5d4;
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
    }

    .status-custom {
      color: #7209b7;
      text-shadow: 0 0 10px rgba(114, 9, 183, 0.4);
    }

    /* Footer Branding */
    .footer-brand {
      margin-top: 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: #e2e8f0;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    .footer-brand span {
      color: #ffd700;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>SUBMIT ID</h1>
    <p class="subtitle">Enter your ID to request or check verification status</p>

    <div class="input-group">
      <input type="text" id="userIdInput" placeholder="Enter Your ID (e.g. DEVIL_99)" />
      <button class="btn" id="submitBtn" onclick="handleSubmission()">SEND / CHECK</button>
    </div>

    <div class="status-container" id="statusBox">
      <div class="status-title">Current Status</div>
      <div class="status-value" id="statusDisplay">--</div>
    </div>

    <div class="footer-brand">
      CREATED BY <span>DEVIL DEVELOPERS</span>
    </div>
  </div>

  
  <!-- Yeh placeholder GitHub Actions replace kar dega -->
    <!-- INJECT_SCRIPT_HERE -->
</body>
</html>
